  <g fill="none" stroke="#ffffff" stroke-linecap="square">
    <path d="M3 16H14" stroke-width="3.4" />
    <path d="M14 16L28.5 6.5" stroke-width="1.4" />
    <path d="M14 16L28.5 25.5" stroke-width="2.8" />
  </g>
</svg>
